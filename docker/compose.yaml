{
  "name": "nodics-agora-electronics-local",
  "services":
    {
      "agora-electronics":
        {
          "image": "nodics/agora-electronics:docker-local",
          "build":
            {
              "context": "..",
              "dockerfile": "docker/Dockerfile",
              "args":
                {
                  "STOREFRONT_ORIGIN": "http://localhost:6400",
                  "STOREFRONT_SITE": "agoraElectronicsSite",
                  "STOREFRONT_STORE": "agoraElectronicsStore",
                  "STOREFRONT_DOMAIN": "electronics",
                  "STOREFRONT_CURRENCY": "AED",
                },
            },
          "restart": "unless-stopped",
          "read_only": true,
          "security_opt": ["no-new-privileges:true"],
          "tmpfs":
            [
              "/var/cache/nginx:rw,noexec,nosuid,size=32m,uid=101,gid=101",
              "/var/run:rw,noexec,nosuid,size=8m,uid=101,gid=101",
            ],
          "ports": ["6400:8080"],
          "healthcheck":
            {
              "test":
                ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"],
              "interval": "10s",
              "timeout": "3s",
              "retries": 10,
            },
          "deploy":
            { "resources": { "limits": { "memory": "128m", "cpus": "0.50" } } },
          "extra_hosts": ["host.docker.internal:host-gateway"],
        },
    },
}
